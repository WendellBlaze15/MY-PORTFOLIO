<!--
  EmailJS "Contact Us" template — the email YOU receive.
  Paste into EmailJS → Email Templates → (your template) → Content → Edit Content → Code Editor.
  Setup steps: docs/emailjs/README.md
-->
<div style="margin:0;padding:24px 12px;background:#f1f0fb;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1e1b4b;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;margin:0 auto;background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(67,56,202,0.12);">
    <!-- Header -->
    <tr>
      <td style="background:#4338ca;background-image:linear-gradient(135deg,#7c3aed 0%,#4338ca 55%,#0ea5e9 100%);padding:28px 28px 24px;">
        <table role="presentation" cellpadding="0" cellspacing="0">
          <tr>
            <td style="width:40px;height:40px;background:rgba(255,255,255,0.18);border-radius:10px;text-align:center;vertical-align:middle;font-weight:800;font-size:15px;color:#ffffff;">WR</td>
            <td style="padding-left:12px;color:#e0e7ff;font-size:13px;letter-spacing:0.4px;">Portfolio contact form</td>
          </tr>
        </table>
        <h1 style="margin:18px 0 4px;font-size:22px;line-height:1.3;color:#ffffff;font-weight:700;">📬 New message from {{from_name}}</h1>
        <p style="margin:0;font-size:13px;color:#e0e7ff;">{{sent_at}}</p>
      </td>
    </tr>

    <!-- Sender details -->
    <tr>
      <td style="padding:24px 28px 8px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f8f7ff;border:1px solid #e4e2fb;border-radius:12px;">
          <tr>
            <td style="padding:14px 16px 6px;font-size:12px;color:#6b7280;text-transform:uppercase;letter-spacing:0.8px;width:90px;">Name</td>
            <td style="padding:14px 16px 6px;font-size:15px;font-weight:600;color:#1e1b4b;">{{from_name}}</td>
          </tr>
          <tr>
            <td style="padding:6px 16px;font-size:12px;color:#6b7280;text-transform:uppercase;letter-spacing:0.8px;">Email</td>
            <td style="padding:6px 16px;font-size:15px;"><a href="mailto:{{from_email}}" style="color:#4f46e5;text-decoration:none;font-weight:600;">{{from_email}}</a></td>
          </tr>
          <tr>
            <td style="padding:6px 16px 14px;font-size:12px;color:#6b7280;text-transform:uppercase;letter-spacing:0.8px;">Subject</td>
            <td style="padding:6px 16px 14px;font-size:15px;color:#1e1b4b;">{{subject}}</td>
          </tr>
        </table>
      </td>
    </tr>

    <!-- Message -->
    <tr>
      <td style="padding:16px 28px 8px;">
        <p style="margin:0 0 8px;font-size:12px;color:#6b7280;text-transform:uppercase;letter-spacing:0.8px;">Message</p>
        <div style="border-left:4px solid #7c3aed;background:#fafafa;border-radius:0 12px 12px 0;padding:16px 18px;font-size:15px;line-height:1.65;color:#111827;white-space:pre-wrap;word-break:break-word;">{{message}}</div>
      </td>
    </tr>

    <!-- Reply button -->
    <tr>
      <td style="padding:20px 28px 28px;">
        <a href="mailto:{{from_email}}?subject=Re:%20{{subject}}" style="display:inline-block;background:#4f46e5;color:#ffffff;text-decoration:none;font-weight:600;font-size:15px;padding:12px 22px;border-radius:10px;">↩ Reply to {{from_name}}</a>
        <p style="margin:12px 0 0;font-size:12px;color:#6b7280;">Tip: pressing Gmail's normal <strong>Reply</strong> also goes straight to {{from_email}}.</p>
      </td>
    </tr>

    <!-- Footer -->
    <tr>
      <td style="padding:16px 28px;background:#f8f7ff;border-top:1px solid #ecebfb;font-size:12px;color:#6b7280;">
        Sent from the contact form on <a href="{{site_url}}" style="color:#4f46e5;text-decoration:none;">{{site_url}}</a>
      </td>
    </tr>
  </table>
</div>
